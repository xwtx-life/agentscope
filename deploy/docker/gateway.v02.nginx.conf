upstream agentscope_api_v2 {
    server agentscope-api-v2:8000;
}

upstream agentscope_web_v2 {
    server agentscope-web-v2:80;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80 default_server;
    server_name _;

    # These prefixes are AgentScope APIs. Match both the prefix itself and
    # nested endpoints; otherwise Nginx falls back to the SPA index.html and
    # the frontend reports an "Unexpected token '<'" JSON parse error.
    # API prefixes (hyphen + underscore). Missing ones fall through to the
    # SPA nginx and POST/PUT/DELETE become 405 Not Allowed.
    location ~ ^/(auth|tenant|departments|agent|sessions|chat|workspace|knowledge_bases|mcp|skill|skill-submissions|skillhub|hub|custom-models|custom_models|credential|schedule|model|tts-model|embedding-model|realtime|server-config)(/|$) {
        proxy_pass http://agentscope_api_v2;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location = /health {
        proxy_pass http://agentscope_api_v2;
        proxy_set_header Host $http_host;
    }

    location / {
        proxy_pass http://agentscope_web_v2;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
